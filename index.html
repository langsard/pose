<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AI Posture Assessment</title>

  <link rel="stylesheet" href="styles/style.css" />

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0"></script>

<!-- Pose Detection -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.0"></script>

</head>

<body>

<h1>AI Posture Assessment</h1>

<div class="app-container">

  <div class="preview-box">
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="controls">
    <input type="file" id="fileInput" hidden />
    <button id="chooseBtn">Choose Image / Video</button>
    <button id="runBtn">Run Full Assessment</button>
  </div>

</div>
<br><br>

<canvas id="outputCanvas"></canvas>

<!-- Frame Interval Modal -->
<div id="intervalModal" class="modal hidden">
  <div class="modal-content">
    <h2>Select Frame Interval (seconds)</h2>
    <input type="number" id="frameIntervalInput" value="1" min="1" />
    <button id="confirmInterval">Confirm</button>
  </div>
</div>

<!-- Result Modal -->
<div id="resultModal" class="modal hidden">
  <div class="modal-content large-modal">
    <h2>Posture Assessment Result</h2>
    <canvas id="resultCanvas"></canvas>
    <div id="angleTable"></div>
    <button id="closeResult">Close</button>
  </div>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
