<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sit Tight - Sit Right</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
</head>

<body>
  <main class="page">

    <header class="header">
      <h1>Ergonomic Assessment</h1>
      <p class="muted">MoveNet Thunder CNN model</p>
    </header>

    <!-- STEP 1 -->
    <section class="step">
      <h2><strong>Step 1:</strong> Select mode</h2>
      <div class="controls">
        <button id="normalModeBtn" class="btn-primary">Normal</button>
        <button id="advanceModeBtn" class="btn-primary">Advance</button>
      </div>
    </section>

    <!-- STEP 2 -->
    <section class="step step-upload">
      <h2><strong>Step 2:</strong> Add photo / video</h2>

      <div id="normalUpload" class="views-row">
        <div class="view-card">
          <div class="box-label">Input</div>
          <div class="image-box">
            <img id="normalPreviewImg" src="examples/normal sample.png">
          </div>
          <input type="file" id="normalInput" accept="image/*,video/*" />
        </div>
      </div>

      <div id="advanceUpload" class="views-row" style="display:none;">
        <div class="view-card">
          <div class="box-label">Front view</div>
          <div class="image-box">
            <img id="frontPreviewImg" src="examples/front.png">
          </div>
          <input type="file" id="frontInput" accept="image/*" />
        </div>

        <div class="view-card">
          <div class="box-label">Side view</div>
          <div class="image-box">
            <img id="sidePreviewImg" src="examples/side.png">
          </div>
          <input type="file" id="sideInput" accept="image/*" />
        </div>
      </div>
    </section>

    <!-- STEP 3 -->
    <section class="step step-run">
      <h2><strong>Step 3:</strong> Get result</h2>
      <div class="controls">
        <button id="runBtn" class="btn-primary" disabled>Run</button>
        <div id="statusText" class="muted">Loading model...</div>
      </div>
      <canvas id="poseCanvas"></canvas>
    </section>

    <footer class="footer muted" style="text-align:center;margin-top:18px;">
      IE project 2025
    </footer>

  </main>

  <!-- IMPORTANT: ONE SCRIPT, ONCE -->
  <script src="app.js" defer></script>
</body>
</html>
