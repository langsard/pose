<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ErgoPose — Single/Advanced (photo or video)</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- TensorFlow.js + Pose Detection -->
  
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  
</head>
<body>
  <div class="container">
    <h1>ErgoPose — Photo / Video Ergonomic Sampler</h1>

    <div class="controls">
      <div class="row">
        <label>Input (photo or video):</label>
        <input id="fileA" type="file" accept="image/*,video/*" />
      </div>

      <div class="row">
        <label>Sampling (sec) — video only:</label>
        <select id="sampling">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="30" selected>30</option>
          <option value="60">60</option>
        </select>

        <label style="margin-left:18px;">
          <input id="advToggle" type="checkbox" />
          Advanced Analysis (2nd view)
        </label>
      </div>

      <div id="advancedArea" class="row hidden">
        <label>Second input (front/side):</label>
        <input id="fileB" type="file" accept="image/*,video/*" />
        <label style="margin-left:12px;">First is:
          <select id="viewRole">
            <option value="front">Front</option>
            <option value="side">Side</option>
          </select>
        </label>
      </div>

      <div class="row">
        <button id="runBtn" disabled>Run Detection</button>
        <span id="status" class="status">Loading model...</span>
      </div>
    </div>

    <hr />

    <div id="previewArea" class="grid">
      <div class="box">
        <h3>Input A Preview</h3>
        <div class="media-box">
          <video id="videoA" class="media" controls></video>
          <img id="imgA" class="media" />
        </div>
      </div>

      <div id="boxB" class="box hidden">
        <h3>Input B Preview</h3>
        <div class="media-box">
          <video id="videoB" class="media" controls></video>
          <img id="imgB" class="media" />
        </div>
      </div>
    </div>

    <hr />

    <div id="resultsContainer">
      <h2>Samples & Results</h2>
      <div id="samplesGrid" class="samples-grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
