<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ErgoPose Best</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>ErgoPose</h2>

  <!-- STEP 1: Model Load -->
  <button id="loadModelBtn">Load MoveNet Thunder</button>
  <div id="modelStatus">Model: Not loaded</div>

  <hr>

  <!-- STEP 2: Image/Video Input -->
  <label class="inputBlock">
    <p>Upload Image</p>
    <input type="file" id="imageInput" accept="image/*">
  </label>

  <label class="inputBlock">
    <p>Upload Video</p>
    <input type="file" id="videoInput" accept="video/*">
  </label>

  <div style="margin-top:10px;">
    <button id="processMediaBtn" disabled>Process</button>
    <button id="cancelBtn" disabled>Cancel</button>
  </div>

  <div id="progressContainer" style="display:none;">
    <progress id="progressBar" value="0" max="100" style="width:300px;"></progress>
    <span id="progressText"></span>
  </div>

  <hr>

  <canvas id="displayCanvas"></canvas>

  <hr>

  <button id="downloadCSVBtn" disabled>Download CSV</button>

  <script src="main.js"></script>

</body>
</html>
