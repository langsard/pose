<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ErgoPose</title>

    <link rel="stylesheet" href="styles.css" />

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

    <!-- TFJS Pose Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@3.6.0"></script>

    <!-- Mediapipe — required for MoveNet -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js"></script>

</head>

<body>
    <div class="page-container">
        <h1>ErgoPose — Quick Ergonomic Check</h1>

        <div id="modelStatus" class="status">Loading model...</div>

        <div class="grid">
            <!-- Input -->
            <div class="box">
                <h2>Your Photo</h2>
                <input id="fileInput" type="file" accept="image/*" />
                <div class="img-container">
                    <img id="inputImg" />
                </div>
            </div>

            <!-- Output -->
            <div class="box">
                <h2>Detected Posture</h2>
                <canvas id="outputCanvas"></canvas>
            </div>
        </div>

        <button id="analyzeBtn">Analyze</button>
        <div id="resultText" class="result"></div>

    </div>

    <script src="app.js"></script>
</body>
</html>
